<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常用特殊符号 · 点按复制</title>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --card-h:#334155; --accent:#2563eb; --txt:#e2e8f0; --muted:#94a3b8; --ok:#16a34a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
    min-height:100vh; color:var(--txt); padding:32px 16px 60px;
  }
  .header{ text-align:center; margin-bottom:26px; }
  .header h1{ font-size:26px; font-weight:700; letter-spacing:1px; }
  .header p{ margin-top:8px; font-size:13px; color:var(--muted); }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:14px; max-width:880px; margin:0 auto;
  }
  .sym{
    background:var(--card); border:1px solid #334155; border-radius:14px;
    min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; transition:all .15s ease; user-select:none; position:relative;
  }
  .sym:hover{ background:var(--card-h); transform:translateY(-3px); box-shadow:0 8px 22px rgba(0,0,0,.35); border-color:var(--accent); }
  .sym:active{ transform:translateY(0) scale(.97); }
  .sym .glyph{ font-size:34px; line-height:1; font-weight:600; }
  .sym .code{ margin-top:8px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .sym .name{ margin-top:2px; font-size:11px; color:#64748b; }
  .toast{
    position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px);
    background:var(--ok); color:#fff; padding:11px 22px; border-radius:30px; font-size:14px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .footer{ text-align:center; margin-top:28px; font-size:12px; color:#475569; }
</style>
</head>
<body>
  <div class="header">
    <h1>常用特殊符号</h1>
    <p>点击任意符号即可复制到剪贴板</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">共 <span id="count">0</span> 个符号 · 点击复制</div>

  <div class="toast" id="toast">已复制</div>

<script>
  // 符号数据：glyph 字符、name 名称、code 编码说明
  const SYMBOLS = [
    {g:'★', n:'实心五角星', c:'U+2605'},
    {g:'❤', n:'红心',       c:'U+2764'},
    {g:'↑', n:'上箭头',     c:'U+2191'},
    {g:'↓', n:'下箭头',     c:'U+2193'},
    {g:'→', n:'右箭头',     c:'U+2192'},
    {g:'←', n:'左箭头',     c:'U+2190'},
    {g:'℃', n:'摄氏度',     c:'U+2103'},
    {g:'≈', n:'约等于',     c:'U+2248'},
    {g:'µ', n:'微/缪',      c:'U+00B5'},
    {g:'Φ', n:'直径/Phi',   c:'U+03A6'},
    {g:'✔', n:'对勾',       c:'U+2714'},
    {g:'╳', n:'叉号',       c:'U+2573'},
    {g:'♀', n:'女性',       c:'U+2640'},
    {g:'♂', n:'男性',       c:'U+2642'},
    {g:'≤', n:'小于等于',   c:'U+2264'},
    {g:'≥', n:'大于等于',   c:'U+2265'},
    {g:'>', n:'大于号',     c:'U+003E'},
    {g:'<', n:'小于号',     c:'U+003C'},
    {g:'δ', n:'小写Δ/delta', c:'U+03B4'},
    {g:'π', n:'圆周率',     c:'U+03C0'},
    {g:'η', n:'希腊η/eta',  c:'U+03B7'},
    {g:'°', n:'度符号',     c:'U+00B0'}
  ];

  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');
  document.getElementById('count').textContent = SYMBOLS.length;

  SYMBOLS.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'sym';
    el.innerHTML = '<div class="glyph">'+s.g+'</div><div class="code">'+s.c+'</div><div class="name">'+s.n+'</div>';
    el.addEventListener('click', ()=> copy(s.g));
    grid.appendChild(el);
  });

  let toastTimer;
  function showToast(txt){
    toast.textContent = txt;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1300);
  }

  function copy(text){
    const done = ()=> showToast('已复制：'+text);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, ()=> fallback(text, done));
    } else {
      fallback(text, done);
    }
  }

  function fallback(text, done){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    done();
  }
</script>
</body>
</html>
