<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常用特殊符号 · 点按复制</title>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --card-h:#334155; --accent:#2563eb; --txt:#e2e8f0; --muted:#94a3b8; --ok:#16a34a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
    min-height:100vh; color:var(--txt); padding:32px 16px 60px;
  }
  .header{ text-align:center; margin-bottom:26px; }
  .header h1{ font-size:26px; font-weight:700; letter-spacing:1px; }
  .header p{ margin-top:8px; font-size:13px; color:var(--muted); }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:14px; max-width:880px; margin:0 auto;
  }
  .sym{
    background:var(--card); border:1px solid #334155; border-radius:14px;
    min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; transition:all .15s ease; user-select:none; position:relative;
  }
  .sym:hover{ background:var(--card-h); transform:translateY(-3px); box-shadow:0 8px 22px rgba(0,0,0,.35); border-color:var(--accent); }
  .sym:active{ transform:translateY(0) scale(.97); }
  .sym .glyph{ font-size:34px; line-height:1; font-weight:600; }
  .sym .glyph svg{ width:36px; height:36px; display:block; }
  .sym .code{ margin-top:8px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .sym .name{ margin-top:2px; font-size:11px; color:#64748b; }
  .toast{
    position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px);
    background:var(--ok); color:#fff; padding:11px 22px; border-radius:30px; font-size:14px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .footer{ text-align:center; margin-top:28px; font-size:12px; color:#475569; }
</style>
</head>
<body>
  <div class="header">
    <h1>常用特殊符号</h1>
    <p>点击任意符号即可复制到剪贴板</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">共 <span id="count">0</span> 个符号 · 点击复制</div>

  <div class="toast" id="toast">已复制</div>

<script>
  // 符号数据：glyph 字符、name 名称、code 编码说明
  // 钢筋级别符号为工程字体图形（无 Unicode 码位），用 body(SVG 路径) 描述，点击复制为图片
  const SYMBOLS = [
    {g:'★', n:'实心五角星', c:'U+2605'},
    {g:'❤', n:'红心',       c:'U+2764'},
    {g:'↑', n:'上箭头',     c:'U+2191'},
    {g:'↓', n:'下箭头',     c:'U+2193'},
    {g:'→', n:'右箭头',     c:'U+2192'},
    {g:'←', n:'左箭头',     c:'U+2190'},
    {g:'℃', n:'摄氏度',     c:'U+2103'},
    {g:'≈', n:'约等于',     c:'U+2248'},
    {g:'µ', n:'微/缪',      c:'U+00B5'},
    {g:'Φ', n:'直径/Phi',   c:'U+03A6'},
    {g:'✔', n:'对勾',       c:'U+2714'},
    {g:'╳', n:'叉号',       c:'U+2573'},
    {g:'♀', n:'女性',       c:'U+2640'},
    {g:'♂', n:'男性',       c:'U+2642'},
    {g:'≤', n:'小于等于',   c:'U+2264'},
    {g:'≥', n:'大于等于',   c:'U+2265'},
    {g:'>', n:'大于号',     c:'U+003E'},
    {g:'<', n:'小于号',     c:'U+003C'},
    {g:'δ', n:'小写Δ/delta', c:'U+03B4'},
    {g:'π', n:'圆周率',     c:'U+03C0'},
    {g:'η', n:'希腊η/eta',  c:'U+03B7'},
    {g:'°', n:'度符号',     c:'U+00B0'},
    {g:'±', n:'正负号',     c:'U+00B1'},
    {body:'<circle cx="20" cy="20" r="11"/><line x1="20" y1="2" x2="20" y2="38"/>', n:'一级 HPB300', c:'钢筋·光圆'},
    {body:'<circle cx="20" cy="20" r="11"/><line x1="20" y1="2" x2="20" y2="38"/><line x1="9" y1="35" x2="31" y2="35"/>', n:'二级 HRB335', c:'钢筋·带肋'},
    {body:'<circle cx="20" cy="20" r="11"/><line x1="16" y1="2" x2="16" y2="38"/><line x1="24" y1="2" x2="24" y2="38"/><line x1="9" y1="35" x2="31" y2="35"/>', n:'三级 HRB400', c:'钢筋·带肋'},
    {body:'<circle cx="20" cy="20" r="11"/><line x1="16" y1="2" x2="16" y2="38"/><line x1="24" y1="2" x2="24" y2="38"/><line x1="9" y1="35" x2="31" y2="35"/><line x1="9" y1="5" x2="31" y2="5"/>', n:'四级 HRB500', c:'钢筋·带肋'}
  ];

  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');
  document.getElementById('count').textContent = SYMBOLS.length;

  const SVG_OPEN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">';

  SYMBOLS.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'sym';
    if(s.body){
      el.innerHTML = '<div class="glyph">'+SVG_OPEN+s.body+'</svg></div><div class="code">'+s.c+'</div><div class="name">'+s.n+'</div>';
      el.addEventListener('click', ()=> copyRebar(s));
    } else {
      el.innerHTML = '<div class="glyph">'+s.g+'</div><div class="code">'+s.c+'</div><div class="name">'+s.n+'</div>';
      el.addEventListener('click', ()=> copy(s.g));
    }
    grid.appendChild(el);
  });

  let toastTimer;
  function showToast(txt){
    toast.textContent = txt;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1300);
  }

  function copy(text){
    const done = ()=> showToast('已复制：'+text);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, ()=> fallback(text, done));
    } else {
      fallback(text, done);
    }
  }

  function fallback(text, done){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    done();
  }

  // 钢筋符号：转成 PNG 图片写入剪贴板，便于粘贴到 Word 等文档；不支持时退化为复制名称文字
  function copyRebar(s){
    const label = s.c + ' ' + s.n;
    const fail = ()=> copy(label);
    const svgText = SVG_OPEN.replace('stroke="currentColor"', 'stroke="#000000"').replace('<svg ', '<svg width="240" height="240" ') + s.body + '</svg>';
    const url = URL.createObjectURL(new Blob([svgText], {type:'image/svg+xml;charset=utf-8'}));
    const img = new Image();
    img.onload = ()=>{
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 240; canvas.height = 240;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 240, 240);
        ctx.drawImage(img, 0, 0, 240, 240);
        canvas.toBlob(blob=>{
          URL.revokeObjectURL(url);
          if(blob && navigator.clipboard && navigator.clipboard.write && window.ClipboardItem){
            navigator.clipboard.write([new ClipboardItem({'image/png': blob})])
              .then(()=> showToast('已复制钢筋符号图片：'+s.c))
              .catch(fail);
          } else { fail(); }
        }, 'image/png');
      } catch(e){ URL.revokeObjectURL(url); fail(); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); fail(); };
    img.src = url;
  }
</script>
</body>
</html>
